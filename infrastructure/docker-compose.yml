services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outrun
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: outrun_aftermath
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
